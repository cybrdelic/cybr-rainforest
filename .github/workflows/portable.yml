name: Portable source and core checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-compile -r asset_gate/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s recovery/src -p test_compat_unit.py -v
      - run: python tools/botanical_study.py --help
